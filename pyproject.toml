[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-orchestra"
version = "0.1.0"
description = "A lightweight, dependency-free multi-agent orchestration framework."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Agent Orchestra" }]
urls = { Homepage = "https://github.com/agent-orchestra/agent-orchestra" }
keywords = ["agents", "orchestration", "multi-agent", "llm", "ai", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.18"]

[project.scripts]
agent-orchestra-demo = "agent_orchestra.examples.demo:main"

[tool.setuptools.packages.find]
include = ["agent_orchestra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]